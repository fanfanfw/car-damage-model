services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: car-damage-ai:cpu
    command: ["uvicorn", "api:app", "--host=0.0.0.0", "--port=18000"]
    env_file: .env
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: car-damage-ai:cpu
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      CAR_DAMAGE_API_URL: "http://api:18000"
      STREAMLIT_SERVER_ADDRESS: "0.0.0.0"
      STREAMLIT_SERVER_PORT: "8501"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    depends_on:
      - api
    restart: unless-stopped
