# Example local nginx server for the Car Damage Assessment API.
# Preparation artifact only — NOT installed. Requires operator approval of the
# network topology (server-111 reverse proxy + local cloudflared tunnel).
#
# Topology this implements:
#   - FastAPI binds 127.0.0.1:18000 (uvicorn).
#   - This nginx listens ONLY on the Tailscale IP 100.124.216.27:18000.
#   - Peer authentication is the TCP source address (allow/deny), NEVER a
#     forwarded header such as X-Forwarded-For / CF-Connecting-IP.
#   - Only peer allowed: 100.76.212.120 (server-111,
#     vps-kantor-ifcon-192-168-1-1-111), which fronts car-damage.ifcontech.com
#     over Tailscale.
#   - NO loopback allow here: the local cloudflared tunnel (public
#     car-damage-api.fanfanfw.biz.id) reaches Uvicorn directly on
#     127.0.0.1:18000, bypassing this listener (verified source-IP proof:
#     local->Tailscale-IP connections carry source 100.124.216.27, which must
#     stay denied).
#   - Public paths are the application paths (/assess, /docs, ...); the
#     uvicorn --root-path /api only affects the OpenAPI servers[0].url.
#
# client_max_body_size sits slightly above the multipart file limit
# (MAX_UPLOAD_BYTES default 20 MiB) to leave room for multipart boundaries.

server {
    listen 100.124.216.27:18000;
    server_name car-damage-api.fanfanfw.biz.id 100.124.216.27;
    access_log off;

    client_max_body_size 21m;

    allow 100.76.212.120;   # server-111 (Tailscale peer) — the only peer
    deny all;

    location / {
        proxy_pass http://127.0.0.1:18000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
